# VIC-20 with 8KB expansion linker configuration
# Memory map:
# $0000-$00FF: Zero page
# $0100-$01FF: Stack
# $0200-$03FF: System variables
# $1000-$11FF: Screen RAM (22x23 = 506 bytes, rounded to 512)
# $1200-$3FFF: Available for program (11.5KB with 8KB expansion)

FEATURES {
    STARTADDRESS: default = $1201;
}

SYMBOLS {
    __LOADADDR__: type = import;
}

MEMORY {
    ZP:       file = "", start = $0070, size = $0020, type = rw, define = yes;
    LOADADDR: file = %O, start = $11FF, size = $0002;
    BASIC:    file = %O, start = $1201, size = $000F, type = ro, fill = yes;
    CODE:     file = %O, start = $1210, size = $2DF0, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    BASIC:    load = BASIC, type = ro;
    CODE:     load = CODE, type = rw;
    RODATA:   load = CODE, type = ro, optional = yes;
    DATA:     load = CODE, type = rw, optional = yes;
    BSS:      load = CODE, type = bss, optional = yes, define = yes;
}

FILES {
    %O: format = bin;
}
